<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Food Label Reading with Computer Vision</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2d3748;
            --accent-color: #4a5568;
            --text-dark: #2d3748;
            --text-light: #718096;
            --bg-primary: #f7fafc;
            --bg-secondary: #ffffff;
            --border-color: #e2e8f0;
            --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--bg-primary);
            overflow-x: hidden;
        }

        .hero-section {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #edf2f7 100%);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="%23e2e8f0" stroke-width="1" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>') repeat;
            opacity: 0.4;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            background: var(--bg-secondary);
            padding: 4rem 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            border: 1px solid var(--border-color);
            animation: fadeInUp 1s ease-out;
        }

        .hero-title {
            font-family: 'Poppins', sans-serif;
            font-size: 3.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 3rem;
            color: var(--text-light);
            font-style: italic;
        }

        .cta-button {
            background: var(--primary-color);
            color: white;
            border: 2px solid var(--primary-color);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            background: var(--bg-secondary);
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }

        .cta-button:active {
            transform: translateY(0);
            box-shadow: var(--shadow-soft);
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .floating-icon:nth-child(1) {
            top: 20%;
            left: 10%;
            font-size: 3rem;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            top: 60%;
            right: 15%;
            font-size: 2.5rem;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(3) {
            bottom: 30%;
            left: 20%;
            font-size: 2rem;
            animation-delay: 4s;
        }

        .floating-icon:nth-child(4) {
            top: 30%;
            right: 30%;
            font-size: 2.8rem;
            animation-delay: 1s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1.2rem;
                margin-bottom: 2rem;
            }
            
            .cta-button {
                padding: 0.8rem 2rem;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 576px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1.1rem;
            }
            
            .cta-button {
                padding: 0.7rem 1.5rem;
                font-size: 1rem;
            }
        }

        /* Accessibility improvements */
        .cta-button:focus {
            outline: 3px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-content,
            .floating-icon,
            .cta-button::before {
                animation: none;
            }
            
            .cta-button:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="hero-section">
        <!-- Floating decorative elements -->
        <div class="floating-elements">
            <i class="fas fa-eye floating-icon"></i>
            <i class="fas fa-mobile-alt floating-icon"></i>
            <i class="fas fa-universal-access floating-icon"></i>
            <i class="fas fa-brain floating-icon"></i>
        </div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">
                    <div class="hero-content">
                        <h1 class="hero-title">
                            Accessible Food Label Reading with Computer Vision for the Blind
                        </h1>
                        <p class="hero-subtitle">
                            Author: Sai Vijay Nagarur
                        </p>
                        <a href="main.html" class="cta-button" role="button" aria-label="Get started with the tutorial">
                            <i class="fas fa-rocket" aria-hidden="true"></i>
                            Get Started
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Optional: Add smooth scrolling and enhanced interactions -->
    <script>
        // Add smooth hover effects and accessibility enhancements
        document.addEventListener('DOMContentLoaded', function() {
            const ctaButton = document.querySelector('.cta-button');
            
            // Add keyboard navigation support
            ctaButton.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    window.location.href = this.href;
                }
            });
            
            // Add loading state for better UX
            ctaButton.addEventListener('click', function(e) {
                this.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Loading...';
            });
        });
    </script>
</body>
</html>
